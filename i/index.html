<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css" />
  <script src="/main.js"></script>
</head>
<body>

<div id="app">

  <div id="main">

    <div id="frame-outer">
      <div id="load-bar"></div>
      <iframe
        id="game-iframe"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"
        allowfullscreen
      ></iframe>
    </div>

    <div id="controls">
      <button class="ctrl-btn" data-tip="Fullscreen" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <button class="ctrl-btn" data-tip="Reload" onclick="reloadFrame()">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
      </button>
      <button class="ctrl-btn" data-tip="Pop out" onclick="popOut()">
        <svg viewBox="0 0 24 24">
          <path d="M15 3h6v6"/>
          <path d="M10 14 21 3"/>
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        </svg>
      </button>
    </div>

  </div>

  <div id="toolbar">
    <a class="tb-btn" href="/">Home</a>
    <a class="tb-btn" href="/g/">Games</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s/">Settings</a>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="/i/i.js"></script>

</body>
</html>
