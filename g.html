<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Novalee</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="main.css" />
  <style>
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 0 20px;
      scrollbar-width: none;
    }
    #content::-webkit-scrollbar { display: none; }

    #page-label {
      font-size: .62rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      margin-bottom: 16px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: border-color .15s;
    }

    .game-card:hover { border-color: var(--border-hi); }
    .game-card:hover .card-cover { filter: brightness(1.08); }

    .card-cover {
      width: 100%;
      aspect-ratio: 3/2;
      background: var(--dim);
      overflow: hidden;
      flex-shrink: 0;
      transition: filter .15s;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-footer {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: .76rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-credit {
      font-family: 'DM Mono', monospace;
      font-size: .58rem;
      color: var(--muted);
      letter-spacing: .04em;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      transition: color .15s;
    }

    .card-credit:hover { color: var(--text); }
  </style>
</head>
<body>

<div id="app">

  <div id="content">
    <div id="page-label">Games</div>
    <div id="grid"></div>
  </div>

  <div id="toolbar">
    <a class="tb-btn" href="/">Home</a>
    <a class="tb-btn active" href="/g.html">Games</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s.html">Settings</a>
  </div>

</div>

<script>
  const GAMES = [
    { name: 'Slope',       key: 'slope',       prefix: 'g', credit: 'truffled' },
    { name: 'Run 3',       key: 'run3',        prefix: 'g', credit: 'truffled' },
    { name: 'Drift Boss',  key: 'drift-boss',  prefix: 'g', credit: 'truffled' },
    { name: 'Tunnel Rush', key: 'tunnel-rush', prefix: 'g', credit: 'truffled' },
    { name: 'Snake',       key: 'snake',       prefix: 'a', credit: 'truffled' },
    { name: 'Tetris',      key: 'tetris',      prefix: 'a', credit: 'truffled' },
    { name: 'Pac-Man',     key: 'pacman',      prefix: 'a', credit: 'truffled' },
    { name: '2048',        key: '2048',        prefix: 'a', credit: 'truffled' },
    { name: 'Chess',       key: 'chess',       prefix: 'p', credit: 'truffled' },
    { name: 'Minecraft',   key: 'minecraft',   prefix: 'p', credit: 'truffled' },
    { name: '273',         key: '273',         prefix: 'i', credit: 'freebuisness' },
  ];

  const CDN_COVERS = 'https://cdn.jsdelivr.net/gh/freebuisness/covers@main';

  const grid = document.getElementById('grid');

  GAMES.forEach(game => {
    const href     = `/i.html?${game.prefix}=${game.key}`;
    const iconSrc  = game.prefix === 'i'
      ? `${CDN_COVERS}/${game.key}.png`
      : `/icons/${game.key}.png`;

    const card = document.createElement('div');
    card.className = 'game-card';

    const coverLink = document.createElement('a');
    coverLink.href = href;
    coverLink.innerHTML = `
      <div class="card-cover">
        <img src="${iconSrc}" alt="" onerror="this.parentElement.style.background='var(--dim)';this.remove();" />
      </div>
    `;

    const footer = document.createElement('div');
    footer.className = 'card-footer';
    footer.innerHTML = `<span class="card-name">${game.name}</span>`;

    if (game.credit) {
      const credit = document.createElement('a');
      credit.className = 'card-credit';
      credit.textContent = game.credit;
      credit.href = `/r.html?=${game.credit}`;
      credit.addEventListener('click', e => e.stopPropagation());
      footer.appendChild(credit);
    }

    card.appendChild(coverLink);
    card.appendChild(footer);
    grid.appendChild(card);
  });
</script>

</body>
</html>
