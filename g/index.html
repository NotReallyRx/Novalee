<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games - Novalee</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css" />
  <script src="/main.js"></script>
  <script src="/lock.js"></script>
  <style>
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 0 20px;
      scrollbar-width: none;
    }
    #content::-webkit-scrollbar { display: none; }

    #page-label {
      font-size: .62rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      margin-bottom: 16px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: border-color .15s;
    }

    .game-card:hover { border-color: var(--border-hi); }
    .game-card:hover .card-cover { filter: brightness(1.08); }

    .card-cover {
      width: 100%;
      aspect-ratio: 3/2;
      background: var(--dim);
      overflow: hidden;
      flex-shrink: 0;
      transition: filter .15s;
    }

    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-footer {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      font-family: 'Syne', sans-serif;
      font-size: .76rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-credit {
      font-family: 'DM Mono', monospace;
      font-size: .58rem;
      color: var(--muted);
      letter-spacing: .04em;
      white-space: nowrap;
      flex-shrink: 0;
      text-decoration: none;
      transition: color .15s;
    }

    .card-credit:hover { color: var(--text); }
  </style>
</head>
<body>

<div id="app">
<div id="search-container">
  <input id="search-bar" type="text" placeholder="Search games..." />
</div>
  <div id="content">
    <div id="page-label">Games</div>
    <div id="grid"></div>
  </div>

  <div id="toolbar">
    <a class="tb-btn" href="/">Home</a>
    <a class="tb-btn active" href="/g/">Games</a>
    <a class="tb-btn" href="/p/">Proxy</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s/">Settings</a>
  </div>

</div>

<!-- YAML parser -->
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<!-- Your logic -->
<script src="/g/g.js"></script>

</body>
</html>
