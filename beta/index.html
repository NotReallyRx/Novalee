<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novalee</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css" />

  <script src="/main.js"></script>
  <script src="/lock.js"></script>

  <style>
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
    }

    #wordmark {
      font-family: 'Syne', sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.01em;
      line-height: 1;
    }

    #tagline {
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
  </style>
</head>

<body>
<div id="app">

  <div id="center">
    <div id="wordmark">Novalee</div>
    <div id="tagline">Play anything</div>

    <!-- 🔥 REPLACED SECTION -->
    <div id="actions">
      <input id="searchInput" placeholder="Search or enter URL..." />
      <button id="searchBtn">Go</button>
    </div>
  </div>

  <div id="toolbar">
    <a class="tb-btn active" href="/">Home</a>
    <a class="tb-btn" href="/g/">Games</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s/">Settings</a>
  </div>

</div>

<!-- ✅ external logic -->
<script src="/p/search.js"></script>

</body>
</html>
