<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games - Novalee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/main.css" />
    <script src="/main.js"></script>
    <script src="/lock.js"></script>
    <script src="/pa/pa.js"></script>
    <style>
      #content {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px 0 20px;
        scrollbar-width: none;
      }
      #content::-webkit-scrollbar {
        display: none;
      }

      #page-label {
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        font-family: "Syne", sans-serif;
        margin-bottom: 16px;
      }

      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 6px;
      }

      .game-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        transition: border-color 0.15s;
      }

      .game-card:hover {
        border-color: var(--border-hi);
      }
      .game-card:hover .card-cover {
        filter: brightness(1.08);
      }

      .card-cover {
        width: 100%;
        aspect-ratio: 3/2;
        background: var(--dim);
        overflow: hidden;
        flex-shrink: 0;
        transition: filter 0.15s;
      }

      .card-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-footer {
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .card-name {
        font-family: "Syne", sans-serif;
        font-size: 0.76rem;
        font-weight: 500;
        color: var(--text);
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-credit {
        font-family: "DM Mono", monospace;
        font-size: 0.58rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        white-space: nowrap;
        flex-shrink: 0;
        text-decoration: none;
        transition: color 0.15s;
      }

      .card-credit:hover {
        color: var(--text);
      }

      #search-container {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #source-select {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        font-family: "DM Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        outline: none;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
      }

      #source-select:focus,
      #source-select:hover {
        border-color: var(--border-hi);
        background: var(--raised);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="search-container">
        <select id="source-select">
          <option value="normal" selected>Normal</option>
          <option value="lumin">LuminSDK</option>
        </select>
        <input id="search-bar" type="text" placeholder="Search games..." />
      </div>
      <div id="content">
        <div id="page-label">Games</div>
        <div id="grid"></div>
      </div>

      <div id="toolbar">
        <span id="tb-label"></span>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
    <script src="load.js"></script>
    <script src="g.js"></script>
  </body>
</html>
