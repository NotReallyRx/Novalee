<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      href="https://google.com/favicon.ico"
      type="image/x-icon"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A lightweight, static proxy browser with many features designed for a simple and flexible browsing experience."
    />

    <meta
      name="keywords"
      content="zinc, zinc browser, web proxy, browser, static proxy, web browser, scramjet, privacy browser, school, unblocker, school proxy, ubg"
    />

    <meta name="author" content="0800" />
    <meta name="robots" content="index, follow" />

    <meta
      name="google-site-verification"
      content="Ow9BnhH-kBrfEmLu70Kz_fn9oZhUVvhZzlTfRvrlRY8"
    />

    <title>Zinc Browser</title>

    <script>
      document.title = "Google";
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <script
      src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js"
      defer
    ></script>

    <script type="module">
      import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
      window.BareMux = BareMux;
    </script>

    <link rel="stylesheet" href="style.css" />

    <script src="./script.js" defer></script>
    <script src="./kb.js" defer></script>

    <script src="../main.js" defer></script>
    <script src="../lock.js" defer></script>

    <link rel="stylesheet" href="/main.css" />

    <script src="../pa/pa.js" defer></script>
  </head>

  <body>
    <!-- Main Browser Application -->
    <div id="app"></div>

    <!-- =========================
     SETTINGS MODAL
========================== -->

    <div class="wisp-settings-modal hidden" id="wisp-settings-modal">
      <div class="settings-card">
        <!-- Main Header -->

        <div class="settings-header settings-main-header">
          <h2>
            <i class="fa-solid fa-gear"></i>
            Settings
          </h2>

          <button
            class="close-btn"
            id="close-wisp-modal"
            aria-label="Close settings"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Scrollable Content -->

        <div class="settings-scroll">
          <!-- =========================
                 TWO COLUMN SETTINGS GRID
            ========================== -->

          <div class="settings-grid">
            <!-- =========================
                     PROXY SETTINGS
                ========================== -->

            <section class="settings-panel">
              <div class="settings-header">
                <h2>
                  <i class="fa-solid fa-server"></i>
                  Proxy Settings
                </h2>
              </div>

              <div class="settings-content">
                <div class="section-title">
                  <i class="fa-solid fa-cloud"></i>

                  Select Server
                </div>

                <div class="server-list" id="server-list"></div>

                <div class="section-title">
                  <i class="fa-solid fa-plus-circle"></i>

                  Custom Server
                </div>

                <div class="custom-input-group">
                  <input
                    type="text"
                    id="custom-wisp-input"
                    placeholder="wss://your-wisp-server.com/wisp/"
                  />

                  <button id="save-custom-wisp" aria-label="Add custom server">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
              </div>

              <div class="settings-footer">
                <i class="fa-solid fa-bolt"></i>

                Lower ping = faster browsing
              </div>
            </section>

            <!-- =========================
                     EXTENSIONS
                ========================== -->

            <section class="settings-panel">
              <div class="settings-header">
                <h2>
                  <i class="fa-solid fa-puzzle-piece"></i>

                  Extensions

                  <span class="beta-badge"> BETA </span>
                </h2>
              </div>

              <div class="settings-content">
                <div class="section-title">
                  <i class="fa-solid fa-file-import"></i>

                  Import Extension
                </div>

                <div class="custom-input-group">
                  <input
                    id="folderPicker"
                    type="file"
                    webkitdirectory
                    multiple
                  />
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <!-- =========================
     EXTENSION IMPORTER
========================== -->

    <script src="extension-importer.js"></script>

    <!-- =========================
     SETTINGS MODAL CONTROLS
========================== -->

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const settingsModal = document.getElementById("wisp-settings-modal");

        const closeSettings = document.getElementById("close-wisp-modal");

        /*
         * Close Button
         */

        if (settingsModal && closeSettings) {
          closeSettings.addEventListener("click", () => {
            settingsModal.classList.add("hidden");
          });
        }

        /*
         * Close when clicking outside
         * the settings card.
         */

        if (settingsModal) {
          settingsModal.addEventListener("click", (event) => {
            if (event.target === settingsModal) {
              settingsModal.classList.add("hidden");
            }
          });
        }

        /*
         * Close with Escape.
         */

        document.addEventListener("keydown", (event) => {
          if (
            event.key === "Escape" &&
            settingsModal &&
            !settingsModal.classList.contains("hidden")
          ) {
            settingsModal.classList.add("hidden");
          }
        });
      });
    </script>

    <!-- =========================
     VERCEL ANALYTICS
========================== -->

    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };

      window.addEventListener("load", () => {
        const wispServer = localStorage.getItem("wispServer");

        if (wispServer) {
          va("event", "wisp_server_used", {
            server: wispServer,
          });
        } else {
          va("event", "wisp_server_used", {
            server: "unknown",
          });
        }
      });

      /*
       * Function used when
       * changing Wisp servers.
       */

      window.trackWispServer = function (server) {
        localStorage.setItem("wispServer", server);

        va("event", "wisp_server_changed", {
          server: server,
        });
      };
    </script>

    <!-- =========================
     DIRECT VISIT FLAG
========================== -->

    <script>
      const direct = document.referrer === "";

      window.vercelFlags = {
        direct_visit: direct,
      };

      document.documentElement.setAttribute(
        "data-flag-direct_visit",

        direct ? "true" : "false",
      );
    </script>

    <!-- Vercel Analytics -->

    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
