<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%">

  <xhtml:iframe
    id="page"
    style="position:absolute;inset:0;width:100%;height:100%;border:0"
  />

  <script><![CDATA[
    fetch("../index.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("page").srcdoc = html;
      });
  ]]></script>

</svg>
