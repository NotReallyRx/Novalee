<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novalee</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css" />
  <script src="/main.js"></script>
  <style>
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
    }

    #wordmark {
      font-family: 'Syne', sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.01em;
      line-height: 1;
    }

    #tagline {
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    #actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      height: 36px;
      padding: 0 20px;
      border-radius: 7px;
      background: var(--raised);
      border: 1px solid var(--border-hi);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all .15s;
    }

    .action-btn:hover {
      background: var(--dim);
      border-color: var(--border-hi);
      color: var(--text);
    }

    .action-btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .action-btn.ghost:hover {
      border-color: var(--border-hi);
      color: var(--text);
      background: var(--surface);
    }
  </style>
</head>
<body>

<div id="app">

  <div id="center">
    <div id="wordmark">Novalee</div>
    <div id="tagline">Play anything</div>
    <div id="actions">
      <a class="action-btn" href="/g/">Browse games</a>
      <a class="action-btn ghost" href="/s/">Settings</a>
    </div>
  </div>

  <div id="toolbar">
    <a class="tb-btn active" href="/">Home</a>
    <a class="tb-btn" href="/g/">Games</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s/">Settings</a>
  </div>

</div>

</body>
</html>
