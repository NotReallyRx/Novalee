<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open this .svg file directly in a browser tab (double-click it,
  or drag it into the browser window). The embedded page fills the
  viewport at 1:1 — no scaling/stretching, just like visiting the
  site normally.

  Note: this only works when the SVG is navigated to as its own
  document. Used as <img src="this.svg"> elsewhere, browsers strip
  scripts/foreignObject content for security and it'll show blank.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <style>
    html, body { margin:0; padding:0; height:100%; }
    iframe { width:100%; height:100%; border:0; display:block; }
  </style>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:iframe
      src="https://novalee.rxk.workers.dev"
      allow="fullscreen; autoplay; picture-in-picture"
      allowfullscreen="true">
    </xhtml:iframe>
  </foreignObject>
</svg>
