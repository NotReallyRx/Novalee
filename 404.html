<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/main.css" />
  <script src="/lock.js"></script>
  <style>
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px;
    }

    #code {
      font-family: 'Syne', sans-serif;
      font-size: 6rem;
      font-weight: 700;
      color: var(--dim);
      line-height: 1;
      letter-spacing: -.02em;
    }

    #msg {
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    #back {
      margin-top: 18px;
    }
  </style>
</head>
<body>

<div id="app">
  <div id="center">
    <div id="code">404</div>
    <div id="msg">Page not found</div>
    <a class="tb-btn active" id="back" href="/">Go home</a>
  </div>

  <div id="toolbar">
    <a class="tb-btn" href="/">Home</a>
    <a class="tb-btn" href="/g/">Games</a>
    <span id="tb-label"></span>
    <a class="tb-btn" href="/s/">Settings</a>
  </div>
</div>

</body>
</html>
