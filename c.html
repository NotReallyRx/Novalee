<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>g.yml Builder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />

<style>
:root {
  --bg:#0a0a0a;
  --surface:#111;
  --border:#1e1e1e;
  --text:#d8d8d8;
  --muted:#555;
}

body {
  margin:0;
  font-family:'DM Mono', monospace;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

#left, #right {
  flex:1;
  padding:16px;
  overflow:auto;
}

h2 {
  font-family:'Syne', sans-serif;
  font-size:.8rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:10px;
}

.section {
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  margin-bottom:12px;
  background:var(--surface);
}

input {
  width:100%;
  margin:4px 0;
  padding:6px;
  background:#000;
  border:1px solid var(--border);
  color:var(--text);
}

button {
  margin-top:6px;
  padding:6px 10px;
  background:#000;
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
}

#output {
  white-space:pre;
  font-size:12px;
}
</style>
</head>
<body>

<div id="left">

<h2>Providers</h2>
<div id="providers"></div>
<button onclick="addProvider()">+ Add Provider</button>

<h2>Games</h2>
<div id="games"></div>
<button onclick="addGame()">+ Add Game</button>

<button onclick="generate()">Generate g.yml</button>

</div>

<div id="right">
<h2>Output</h2>
<pre id="output"></pre>
</div>

<script>
let providers = [];
let games = [];

function addProvider() {
  const p = {
    name:'', repo:'', dir:'', prefix:'gh', tag:'main', credit:'', cdn:'jsdelivr',
    cover_repo:'', cover_dir:'', cover_ext:'png'
  };
  providers.push(p);
  render();
}

function addGame() {
  const g = {
    name:'', provider:'', repo:'', file:'', prefix:'gh', tag:'main', credit:'', cdn:'jsdelivr', cover:''
  };
  games.push(g);
  render();
}

function render() {
  const pDiv = document.getElementById('providers');
  const gDiv = document.getElementById('games');

  pDiv.innerHTML = '';
  gDiv.innerHTML = '';

  providers.forEach((p,i)=>{
    pDiv.innerHTML += `
    <div class="section">
      <input placeholder="name" value="${p.name}" oninput="providers[${i}].name=this.value">
      <input placeholder="repo" value="${p.repo}" oninput="providers[${i}].repo=this.value">
      <input placeholder="dir" value="${p.dir}" oninput="providers[${i}].dir=this.value">
      <input placeholder="credit" value="${p.credit}" oninput="providers[${i}].credit=this.value">
      <input placeholder="cover_repo" value="${p.cover_repo}" oninput="providers[${i}].cover_repo=this.value">
      <input placeholder="cover_dir" value="${p.cover_dir}" oninput="providers[${i}].cover_dir=this.value">
      <input placeholder="cover_ext" value="${p.cover_ext}" oninput="providers[${i}].cover_ext=this.value">
    </div>`;
  });

  games.forEach((g,i)=>{
    gDiv.innerHTML += `
    <div class="section">
      <input placeholder="name" value="${g.name}" oninput="games[${i}].name=this.value">
      <input placeholder="provider" value="${g.provider}" oninput="games[${i}].provider=this.value">
      <input placeholder="repo override" value="${g.repo}" oninput="games[${i}].repo=this.value">
      <input placeholder="file" value="${g.file}" oninput="games[${i}].file=this.value">
      <input placeholder="credit override" value="${g.credit}" oninput="games[${i}].credit=this.value">
      <input placeholder="cover (optional)" value="${g.cover}" oninput="games[${i}].cover=this.value">
    </div>`;
  });
}

function generate() {
  let out = 'providers:\n';

  providers.forEach(p=>{
    if(!p.name) return;
    out += `  - name: ${p.name}\n`;
    out += `    repo: ${p.repo}\n`;
    out += `    dir: ${p.dir || ''}\n`;
    out += `    prefix: ${p.prefix}\n`;
    out += `    tag: ${p.tag}\n`;
    out += `    credit: ${p.credit}\n`;
    out += `    cdn: ${p.cdn}\n`;

    if(p.cover_repo) out += `    cover_repo: ${p.cover_repo}\n`;
    if(p.cover_dir) out += `    cover_dir: ${p.cover_dir}\n`;
    if(p.cover_ext) out += `    cover_ext: ${p.cover_ext}\n`;
  });

  out += '\n\ngames:\n';

  games.forEach(g=>{
    if(!g.name) return;

    out += `  - name: ${g.name}\n`;

    if(g.provider) out += `    provider: ${g.provider}\n`;
    if(g.repo) out += `    repo: ${g.repo}\n`;

    out += `    file: ${g.file}\n`;

    if(g.credit) out += `    credit: ${g.credit}\n`;
    if(g.cover) out += `    cover: ${g.cover}\n`;
  });

  document.getElementById('output').textContent = out;
}

// init
addProvider();
addGame();
</script>

</body>
</html>
